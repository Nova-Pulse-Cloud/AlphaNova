name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: [3.11]

    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python }}
          check-latest: false
          update-environment: true
          allow-prereleases: false

      - name: 📦 Install linters & formatters
        run: |
          python -m pip install --upgrade pip
          pip install \
            black \
            isort \
            autoflake \
            flake8

      - name: 🔍 Format-check with Black
        run: |
          black --check .

      - name: ➕ Import-sorting with isort
        run: |
          isort --check-only --diff .

      - name: 🧹 Remove unused imports/code with autoflake
        run: |
          autoflake --check --recursive --remove-all-unused-imports --remove-unused-variables .

      - name: 📏 Code-style lint with flake8
        run: |
          flake8 .

      # ─── add your test step(s) here if you have any ─────────────────────
      # - name: ▶️ Run tests
      #   run: |
      #     pytest

