name: CI

on: [push, pull_request]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'   # match your runtime

      - name: Install formatting & linting tools
        run: |
          pip install --upgrade black isort autoflake flake8

      - name: Autoflake (remove unused imports/vars)
        run: |
          autoflake \
            --remove-all-unused-imports \
            --remove-unused-variables \
            --in-place \
            --recursive \
            .

      - name: isort (sort imports)
        run: isort .

      - name: black (format code)
        run: black .

      - name: flake8 (lint check)
        run: flake8 .
