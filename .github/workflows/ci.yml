name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: false

      - name: Install linters & formatters
        run: |
          python -m pip install --upgrade pip
          pip install black isort autoflake flake8

      - name: Automatically remove unused imports & vars
        run: |
          autoflake \
            --recursive \
            --in-place \
            --remove-all-unused-imports \
            --remove-unused-variables \
            .

      - name: Sort imports
        run: |
          isort .

      - name: Reformat code
        run: |
          black .

      - name: Lint & formatting checks
        run: |
          black --check .
          isort --check-only .
          autoflake --check --recursive --remove-all-unused-imports --remove-unused-variables .
          flake8 .

