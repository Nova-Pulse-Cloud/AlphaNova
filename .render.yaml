services:
  - type: web
    name: nova-alpha-launch
    env: python
    pythonVersion: 3.10.12
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: python -m uvicorn main_service:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        fromSecret: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        fromSecret: TELEGRAM_CHAT_ID
      - key: SOL_PRIVATE_KEY_PATH
        fromSecret: SOL_PRIVATE_KEY_PATH
      - key: SOL_ADDRESS
        fromSecret: SOL_ADDRESS
      - key: REDIS_URL
        fromSecret: REDIS_URL
      - key: HELIUS_RPC
        fromSecret: HELIUS_RPC
      - key: HELIUS_API_KEY
        fromSecret: HELIUS_API_KEY
      - key: CMC_API_KEY
        fromSecret: CMC_API_KEY
      - key: GECKO_API_URL
        fromSecret: GECKO_API_URL
      - key: OPENAI_API_KEY
        fromSecret: OPENAI_API_KEY
      - key: TWITTER_BEARER_TOKEN
        fromSecret: TWITTER_BEARER_TOKEN
      - key: MACRO_API_URL
        fromSecret: MACRO_API_URL
      - key: MACRO_API_KEY
        fromSecret: MACRO_API_KEY
      - key: ETHERSCAN_API_KEY
        fromSecret: ETHERSCAN_API_KEY
      - key: WEBHOOK_URL
        fromSecret: WEBHOOK_URL
      - key: DASHBOARD_URL
        fromSecret: DASHBOARD_URL
      - key: HTTP_TIMEOUT
        value: "15"
      - key: JUPITER_SWAP_ENDPOINT
        value: "https://quote-api.jup.ag/v6/swap"
